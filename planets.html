    <p class="para">This is a visual representatin of the Solar System and planets consists in it. Click on any planet you want(including the sun) and find out the facts you need to know about it. Scroll down to know more!</p>

    <script>
        let sun = document.getElementById('sun')
        let mer = document.getElementById('mercury');
        let ven = document.getElementById('venus');
        let ear = document.getElementById('earth');
        let mar = document.getElementById('mars');
        let jup = document.getElementById('jupiter');
        let sat = document.getElementById('saturn');
        let ura = document.getElementById('uranus');
        let nep = document.getElementById('neptune');

        window.addEventListener('scroll',function(){
            let value = window.scrollY;
            sun.style.left = value * -2.8 + 'px';

            mer.style.left = value * -2.2 + 'px';

            ven.style.left = value * -1.8 + 'px';

            ear.style.left = value * -1.5 + 'px';

            mar.style.left = value * -1.0 + 'px';

            jup.style.left = value * -0.2 + 'px';

            sat.style.left = value * 0.8 + 'px';

            ura.style.left = value * 1.6 + 'px';

            nep.style.left = value * 2.3 + 'px';
        });
    </script>
